name: Isolated Windows AYA native validation
on:
  push:
    branches: [codex/aya-native-validation]
    paths:
      - .github/workflows/native-validation.yml
      - scripts/fetch-official-4b-metadata.cjs
      - scripts/run-windows-aya-native.cjs
      - scripts/verify-aya-native.cjs
      - electron/aya-local.cjs
      - electron/aya/**
permissions:
  contents: read
concurrency:
  group: isolated-aya-native-validation-instruct-2507
  cancel-in-progress: false
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      AYA_EVIDENCE_DIRECTORY: native-validation-evidence/instruct-2507
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.19.0
      - name: Pin npm toolchain
        shell: pwsh
        run: |
          if ((npm --version).Trim() -ne '11.9.0') { npm install --global npm@11.9.0; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          if ((npm --version).Trim() -ne '11.9.0') { throw 'npm toolchain mismatch' }
      - name: Install locked production dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Actual pinned model inference
        run: node scripts/run-windows-aya-native.cjs --output $env:AYA_EVIDENCE_DIRECTORY
      - name: Record tested source and exact model publisher metadata
        if: always()
        shell: pwsh
        run: |
          @'
          const fs=require('node:fs'),crypto=require('node:crypto'),evidence=process.env.AYA_EVIDENCE_DIRECTORY,reportFile=name=>require('node:path').join(evidence,name);
          fs.mkdirSync(evidence,{recursive:true});
          const names=['electron/aya-local.cjs','electron/aya/managed-runtime.cjs','electron/aya/core.cjs','electron/aya/dialogue.cjs','electron/aya/agent.cjs','scripts/verify-aya-native.cjs','scripts/run-windows-aya-native.cjs'];
          const hashes=Object.fromEntries(names.map(name=>[name,crypto.createHash('sha256').update(fs.readFileSync(name)).digest('hex')]));
          fs.writeFileSync(reportFile('source-info.json'),JSON.stringify({testedCommit:process.env.GITHUB_SHA,runnerOS:process.platform,node:process.version,runId:process.env.GITHUB_RUN_ID,sourceHashes:hashes},null,2)+'\n');
          (async()=>{try{const r=await fetch('https://huggingface.co/api/models/unsloth/Qwen3-4B-Instruct-2507-GGUF/revision/a06e946bb6b655725eafa393f4a9745d460374c9?blobs=true',{signal:AbortSignal.timeout(20000)});const data=r.ok?await r.json():null;fs.writeFileSync(reportFile('publisher-model-metadata.json'),JSON.stringify({httpStatus:r.status,revision:data?.sha,files:data?.siblings?.filter(f=>f.rfilename.endsWith('.gguf')).map(f=>({name:f.rfilename,lfs:f.lfs}))},null,2)+'\n');}catch{fs.writeFileSync(reportFile('publisher-model-metadata.json'),JSON.stringify({error:'OFFICIAL_METADATA_UNAVAILABLE'})+'\n');}})();
          (async()=>{const sourceURL='https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/a06e946bb6b655725eafa393f4a9745d460374c9/README.md';try{const r=await fetch(sourceURL,{signal:AbortSignal.timeout(20000)});const content=r.ok?await r.text():'';fs.writeFileSync(reportFile('publisher-model-card-proof.json'),JSON.stringify({sourceURL,httpStatus:r.status,bytes:Buffer.byteLength(content),sha256:crypto.createHash('sha256').update(content).digest('hex'),relevantLines:content.split('\n').filter(line=>/temperature|top_p|top_k|min_p|greedy|best practices|non-thinking/i.test(line))},null,2)+'\n');}catch{fs.writeFileSync(reportFile('publisher-model-card-proof.json'),JSON.stringify({sourceURL,error:'OFFICIAL_MODELCARD_UNAVAILABLE'})+'\n');}})();
          '@ | node
      - name: Commit only diagnostic reports to isolated branch
        if: always()
        shell: pwsh
        run: |
          git config user.name 'DentAYA native validation'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          $allowed = @('windows-native-result.json','native-inference-report.json','native-acceptance.txt','source-info.json','publisher-model-metadata.json','official-4b-metadata.json','publisher-model-card-proof.json','official-instruct-2507-metadata.json')
          foreach ($name in $allowed) { $file = Join-Path $env:AYA_EVIDENCE_DIRECTORY $name; if (Test-Path -LiteralPath $file) { git add -- $file; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } } }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) { git commit -m 'Record isolated Windows native inference evidence'; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; git pull --rebase origin codex/aya-native-validation; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; git push origin HEAD:codex/aya-native-validation; exit $LASTEXITCODE }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
