name: Isolated Windows AYA native validation
on:
  push:
    branches: [codex/aya-native-validation]
    paths:
      - .github/workflows/native-validation.yml
      - scripts/fetch-official-4b-metadata.cjs
      - scripts/run-windows-aya-native.cjs
      - scripts/verify-aya-native.cjs
      - electron/aya-local.cjs
      - electron/aya/**
permissions:
  contents: read
concurrency:
  group: isolated-aya-native-validation
  cancel-in-progress: false
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.19.0
      - name: Discover official 4B immutable pin (metadata only)
        run: node scripts/fetch-official-4b-metadata.cjs
      - name: Commit only diagnostic reports to isolated branch
        if: always()
        shell: pwsh
        run: |
          git config user.name 'DentAYA native validation'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          $allowed = @('official-4b-metadata.json')
          foreach ($name in $allowed) { $file = "native-validation-evidence/$name"; if (Test-Path -LiteralPath $file) { git add -- $file; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } } }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) { git commit -m 'Record official 4B metadata without inference'; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; git push origin HEAD:codex/aya-native-validation; exit $LASTEXITCODE }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
