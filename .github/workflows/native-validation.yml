name: Isolated Windows AYA native validation
on:
  push:
    branches: [codex/aya-native-validation]
    paths:
      - .github/workflows/native-validation.yml
      - scripts/fetch-official-4b-metadata.cjs
      - scripts/run-windows-aya-native.cjs
      - scripts/verify-aya-native.cjs
      - electron/aya-local.cjs
      - electron/aya/**
permissions:
  contents: read
concurrency:
  group: isolated-aya-native-validation-english-policy-sampling
  cancel-in-progress: false
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      AYA_EVIDENCE_DIRECTORY: native-validation-evidence/english-policy-sampling
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.19.0
      - name: Pin npm toolchain
        shell: pwsh
        run: |
          if ((npm --version).Trim() -ne '11.9.0') { npm install --global npm@11.9.0; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          if ((npm --version).Trim() -ne '11.9.0') { throw 'npm toolchain mismatch' }
      - name: Install locked production dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Actual pinned model inference
        run: node scripts/run-windows-aya-native.cjs --output $env:AYA_EVIDENCE_DIRECTORY
      - name: Record tested source and official model metadata
        if: always()
        shell: pwsh
        run: |
          @'
          const fs=require('node:fs'),crypto=require('node:crypto'),evidence=process.env.AYA_EVIDENCE_DIRECTORY,reportFile=name=>require('node:path').join(evidence,name);
          fs.mkdirSync(evidence,{recursive:true});
          const names=['electron/aya-local.cjs','electron/aya/managed-runtime.cjs','electron/aya/core.cjs','electron/aya/dialogue.cjs','electron/aya/agent.cjs','scripts/verify-aya-native.cjs','scripts/run-windows-aya-native.cjs'];
          const hashes=Object.fromEntries(names.map(name=>[name,crypto.createHash('sha256').update(fs.readFileSync(name)).digest('hex')]));
          fs.writeFileSync(reportFile('source-info.json'),JSON.stringify({testedCommit:process.env.GITHUB_SHA,runnerOS:process.platform,node:process.version,runId:process.env.GITHUB_RUN_ID,sourceHashes:hashes},null,2)+'\n');
          (async()=>{try{const r=await fetch('https://huggingface.co/api/models/Qwen/Qwen3-4B-GGUF/revision/bc640142c66e1fdd12af0bd68f40445458f3869b?blobs=true',{signal:AbortSignal.timeout(20000)});const data=r.ok?await r.json():null;fs.writeFileSync(reportFile('official-model-metadata.json'),JSON.stringify({httpStatus:r.status,revision:data?.sha,files:data?.siblings?.filter(f=>f.rfilename.endsWith('.gguf')).map(f=>({name:f.rfilename,lfs:f.lfs}))},null,2)+'\n');}catch{fs.writeFileSync(reportFile('official-model-metadata.json'),JSON.stringify({error:'OFFICIAL_METADATA_UNAVAILABLE'})+'\n');}})();
          (async()=>{const sourceURL='https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/bc640142c66e1fdd12af0bd68f40445458f3869b/README.md';try{const r=await fetch(sourceURL,{signal:AbortSignal.timeout(20000)});const content=r.ok?await r.text():'';fs.writeFileSync(reportFile('official-model-card-proof.json'),JSON.stringify({sourceURL,httpStatus:r.status,bytes:Buffer.byteLength(content),sha256:crypto.createHash('sha256').update(content).digest('hex'),relevantLines:content.split('\n').filter(line=>/temperature|top_p|top_k|min_p|greedy|best practices|non-thinking/i.test(line))},null,2)+'\n');}catch{fs.writeFileSync(reportFile('official-model-card-proof.json'),JSON.stringify({sourceURL,error:'OFFICIAL_MODELCARD_UNAVAILABLE'})+'\n');}})();
          (async()=>{const repo='Qwen/Qwen3-4B-Instruct-2507-GGUF',discoveryURL='https://huggingface.co/api/models/'+repo+'?blobs=true',result={purpose:'official-instruct-model-pin-discovery',nativeInferenceAttempted:false,repository:repo,discoveryURL};try{const r=await fetch(discoveryURL,{signal:AbortSignal.timeout(20000)});result.httpStatus=r.status;if(!r.ok)throw Error('OFFICIAL_METADATA_HTTP_'+r.status);const discovery=await r.json();if(discovery.id!==repo||!/^[a-f0-9]{40}$/.test(discovery.sha))throw Error('OFFICIAL_METADATA_IDENTITY');result.sourceURL='https://huggingface.co/api/models/'+repo+'/revision/'+discovery.sha+'?blobs=true';const p=await fetch(result.sourceURL,{signal:AbortSignal.timeout(20000)});if(!p.ok)throw Error('OFFICIAL_PINNED_METADATA_HTTP_'+p.status);const pinned=await p.json();if(pinned.id!==repo||pinned.sha!==discovery.sha)throw Error('OFFICIAL_METADATA_REVISION');const files=pinned.siblings?.filter(file=>/q4_k_m\.gguf$/i.test(file.rfilename));if(files?.length!==1)throw Error('OFFICIAL_METADATA_FILE_AMBIGUOUS');const file=files[0],sha256=file.lfs?.sha256??file.lfs?.oid;if(!/^[a-f0-9]{64}$/.test(sha256)||!Number.isSafeInteger(file.lfs?.size))throw Error('OFFICIAL_METADATA_LFS');Object.assign(result,{status:'verified-official-metadata',revision:pinned.sha,license:pinned.cardData?.license,file:{name:file.rfilename,bytes:file.lfs.size,sha256,url:'https://huggingface.co/'+repo+'/resolve/'+pinned.sha+'/'+file.rfilename}});}catch(error){result.status='failed';result.error=/^[A-Z0-9_]+$/.test(error.message)?error.message:'OFFICIAL_METADATA_UNAVAILABLE';}fs.writeFileSync(reportFile('official-instruct-2507-metadata.json'),JSON.stringify(result,null,2)+'\n');})();
          '@ | node
      - name: Commit only diagnostic reports to isolated branch
        if: always()
        shell: pwsh
        run: |
          git config user.name 'DentAYA native validation'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          $allowed = @('windows-native-result.json','native-inference-report.json','native-acceptance.txt','source-info.json','official-model-metadata.json','official-4b-metadata.json','official-model-card-proof.json','official-instruct-2507-metadata.json')
          foreach ($name in $allowed) { $file = Join-Path $env:AYA_EVIDENCE_DIRECTORY $name; if (Test-Path -LiteralPath $file) { git add -- $file; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } } }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) { git commit -m 'Record isolated Windows native inference evidence'; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; git pull --rebase origin codex/aya-native-validation; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; git push origin HEAD:codex/aya-native-validation; exit $LASTEXITCODE }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
