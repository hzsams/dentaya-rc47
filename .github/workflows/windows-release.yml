name: Verified Windows desktop release

on:
  push:
    branches:
      - 'codex/rc62-guncel-kaynak'
    tags:
      - 'v1.0.0-rc.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  windows-build:
    name: Build and smoke the actual Windows installer
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Select the pinned npm tool
        shell: pwsh
        run: |
          npm install --global npm@11.9.0 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((node --version) -ne 'v24.19.0' -or (npm --version) -ne '11.9.0') { throw 'Unexpected Node/npm tool versions' }
      - name: Verify exact checkout, release tag, and source manifest
        shell: pwsh
        run: |
          node scripts/verify-windows-ci-source.mjs --commit $env:GITHUB_SHA --ref $env:GITHUB_REF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-source-integrity.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the runner's full NSIS extraction support
        shell: pwsh
        run: |
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          if (-not (Test-Path $sevenZip -PathType Leaf)) { throw 'Full 7-Zip is missing from the Windows runner' }
          $formats = & $sevenZip i
          if ($LASTEXITCODE -ne 0 -or -not ($formats -match 'Nsis')) { throw 'Full 7-Zip lacks the NSIS decoder required to verify the installer payload' }
      - name: Install the exact lockfile dependencies
        run: npm ci --no-audit --no-fund
      - name: Run all source checks and production build
        run: npm run verify
      - name: Package the existing verified production build
        run: npm run desktop:package
      - name: Verify installer payload and smoke its extracted Electron executable
        shell: pwsh
        run: |
          $arguments = @('scripts/verify-windows-artifact.mjs', '--project', '.', '--output', 'ci-artifacts/windows-release', '--commit', $env:GITHUB_SHA)
          if ($env:GITHUB_REF.StartsWith('refs/tags/')) { $arguments += @('--tag', $env:GITHUB_REF_NAME) }
          node @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-windows-ci-source.mjs --commit $env:GITHUB_SHA --ref $env:GITHUB_REF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Summarize exact-source Windows verification
        shell: pwsh
        run: |
          $receipt = Get-Content ci-artifacts/windows-release/windows-build-receipt.json -Raw | ConvertFrom-Json
          @(
            '## Windows installer'
            "Source: $($receipt.commit)"
            "Installer: $($receipt.installer.bytes) bytes, SHA-256 $($receipt.installer.sha256)"
            "Extracted Electron architecture: $('0x{0:X4}' -f $receipt.executable.machine)"
            "Fresh-profile routes: $($receipt.desktopSmoke.routes -join ', ')"
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: verified-windows-installer
          overwrite: true
          path: |
            ci-artifacts/windows-release/DentAYA-Setup-*.exe
            ci-artifacts/windows-release/SHA256SUMS.txt
            ci-artifacts/windows-release/windows-build-receipt.json
            ci-artifacts/windows-release/desktop-smoke-report.json
          if-no-files-found: error
          retention-days: 14

  windows-native:
    name: Real native AYA (${{ matrix.model }})
    runs-on: windows-2025
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(github.ref == 'refs/heads/codex/rc62-guncel-kaynak' && '["baseline","candidate"]' || '["baseline"]') }}
    env:
      AYA_NATIVE_PROFILE: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Select the pinned npm tool
        shell: pwsh
        run: |
          npm install --global npm@11.9.0 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((node --version) -ne 'v24.19.0' -or (npm --version) -ne '11.9.0') { throw 'Unexpected Node/npm tool versions' }
      - name: Verify exact source and install dependencies
        shell: pwsh
        run: |
          node scripts/verify-windows-ci-source.mjs --commit $env:GITHUB_SHA --ref $env:GITHUB_REF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-source-integrity.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare the candidate CAD browser fixture
        if: matrix.model == 'candidate'
        continue-on-error: true
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'dentaya-cad-playwright'
          npm install --prefix $fixture --ignore-scripts --no-save --package-lock=false --no-audit --no-fund playwright-core@1.57.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $browser = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe')
            (Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw 'A Chromium browser is required for real CAD evidence' }
          "DENTAYA_PLAYWRIGHT_MODULE=$(Join-Path $fixture 'node_modules/playwright-core/index.mjs')" | Add-Content $env:GITHUB_ENV
          "DENTAYA_CHROMIUM_PATH=$browser" | Add-Content $env:GITHUB_ENV
      - name: Exercise real conversation, memory, and synthetic CAD model calls
        shell: pwsh
        run: |
          $nativeArgs = @('--output', 'ci-artifacts/native')
          if ($env:AYA_NATIVE_PROFILE -eq 'candidate') { $nativeArgs += @('--candidate', '--cad-browser') }
          node scripts/run-windows-aya-native.cjs @nativeArgs
          exit $LASTEXITCODE
      - name: Record native report source provenance
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-artifacts/native | Out-Null
          node -e "const fs=require('node:fs');fs.writeFileSync('ci-artifacts/native/source-provenance.json',JSON.stringify({commit:process.env.GITHUB_SHA,version:require('./package.json').version,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,job:'windows-native',profile:process.env.AYA_NATIVE_PROFILE},null,2)+'\n')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Summarize exact-source native AYA evidence
        if: always()
        shell: pwsh
        run: |
          $path = 'ci-artifacts/native/windows-native-result.json'
          if (-not (Test-Path $path)) { 'Native report unavailable.' | Add-Content $env:GITHUB_STEP_SUMMARY; exit 0 }
          $status = Get-Content $path -Raw | ConvertFrom-Json
          $native = Get-Content ci-artifacts/native/native-inference-report.json -Raw | ConvertFrom-Json
          $failed = @($native.semanticReview.signals | Where-Object { $_.pass -eq $false } | ForEach-Object { $_.id })
          @(
            "## Native AYA ($env:AYA_NATIVE_PROFILE)"
            "Source: $env:GITHUB_SHA"
            "Verified model: $($status.model.id), $($status.model.bytes) bytes, SHA-256 $($status.model.sha256), integrity $($status.model.verified)"
            "Result: $($status.status) $($status.error)"
            "Actual inference observed: $($status.nativeInferenceObserved)"
            "Base cases: $($status.casesSucceeded)/$($status.casesAttempted)"
            "Module cases: $($native.moduleCases.succeeded)/$($native.moduleCases.attempted)"
            "Navigation cases: $($native.navigationCases.succeeded)/$($native.navigationCases.attempted)"
            "Cancellation and restart: $($native.runtimeChecks.passed)"
            "Runner RAM: $($native.hardware.memoryBytes) bytes"
            "Lowest observed free RAM: $($native.hardware.lowestObservedFreeBytes) bytes"
            "4K CAD and native model: $($native.cadBrowser.pass) $($native.cadBrowser.stage) $($native.cadBrowser.error)"
            "Failed behavior signals: $($failed -join ', ')"
            'Review the synthetic responses for semantic quality.'
            '<details><summary>Synthetic responses</summary>'
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
          foreach ($check in $native.checks) {
            $content = [string]$check.reply.output
            if ($content.Length -gt 2000) { $content = $content.Substring(0, 2000) + ' [shortened]' }
            $content = [System.Net.WebUtility]::HtmlEncode($content)
            "<h4>$($check.name)</h4><pre>$content</pre>" | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          '</details>' | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: ${{ matrix.model == 'candidate' && 'windows-native-candidate-evidence' || 'windows-native-evidence' }}
          overwrite: true
          path: |
            ci-artifacts/native/native-inference-report.json
            ci-artifacts/native/windows-native-result.json
            ci-artifacts/native/native-acceptance.txt
            ci-artifacts/native/source-provenance.json
            ci-artifacts/native/native-aya-cad-4k.png
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified tag assets with actual native results
    needs: [windows-build, windows-native]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.windows-build.result == 'success' && (needs.windows-native.result == 'success' || needs.windows-native.result == 'failure') }}
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verified-windows-installer
          path: ci-artifacts/windows-release
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: windows-native-evidence
          path: ci-artifacts/native
      - name: Recheck assets and publish the tag release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-windows-release.mjs --release-dir ci-artifacts/windows-release --native-dir ci-artifacts/native --commit $env:GITHUB_SHA --tag $env:GITHUB_REF_NAME
